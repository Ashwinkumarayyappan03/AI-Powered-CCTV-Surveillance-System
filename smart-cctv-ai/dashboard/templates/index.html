<!-- dashboard/templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CCTV Surveillance Dashboard</title>
    <script src="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js)"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a1a2e; 
            color: #eee; 
            min-height: 100vh;
        }
        .header {
            background: #16213e;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e94560;
        }
        .header h1 { color: #e94560; }
        .status { 
            display: flex; 
            align-items: center; 
            gap: 0.5rem;
        }
        .status-dot {
            width: 12px; height: 12px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
            padding: 1rem;
            max-width: 1600px;
            margin: 0 auto;
        }
        .video-container {
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-container img {
            width: 100%;
            height: auto;
        }
        .sidebar { display: flex; flex-direction: column; gap: 1rem; }
        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 1rem;
        }
        .card h3 { 
            color: #e94560; 
            margin-bottom: 1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .stat-item {
            background: #1a1a2e;
            padding: 1rem;
            border-radius: 4px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00ff88;
        }
        .stat-label { color: #888; font-size: 0.9rem; }
        .alerts-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .alert-item {
            background: #1a1a2e;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 4px;
            border-left: 3px solid #e94560;
        }
        .alert-item.fight { border-color: #ff0000; }
        .alert-item.theft { border-color: #ff9900; }
        .alert-time { color: #666; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎥 AI Surveillance System</h1>
        <div class="status">
            <div class="status-dot"></div>
            <span>LIVE</span>
        </div>
    </div>
    
    <div class="container">
        <div class="video-container">
            <img src="/video_feed" alt="Live Feed">
        </div>
        
        <div class="sidebar">
            <div class="card">
                <h3>📊 Live Statistics</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="fps">0</div>
                        <div class="stat-label">FPS</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="people">0</div>
                        <div class="stat-label">People</div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h3>🚨 Recent Alerts</h3>
                <div class="alerts-list" id="alerts"></div>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        
        // Update stats every second
        setInterval(async () => {
            const res = await fetch('/stats');
            const data = await res.json();
            document.getElementById('fps').textContent = data.fps;
            document.getElementById('people').textContent = data.people_count;
        }, 1000);
        
        // Real-time alerts
        socket.on('new_alert', (alert) => {
            const alertsDiv = document.getElementById('alerts');
            const alertEl = document.createElement('div');
            alertEl.className = `alert-item ${alert.type}`;
            alertEl.innerHTML = `
                <div><strong>${alert.type.toUpperCase()}</strong></div>
                <div>${alert.message}</div>
                <div class="alert-time">${alert.time}</div>
            `;
            alertsDiv.prepend(alertEl);
        });
    </script>
</body>
</html>
